<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contacts | SportZone Admin</title>
    <link rel="stylesheet" th:href="@{/css/sportzone.css}">
</head>

<body class="adminx-body">
    <div class="adminx-shell">
        <div th:replace="~{admin/fragments/admin-sidebar :: adminSidebar}"></div>

        <main class="adminx-main">
            <div class="adminx-top">
                <div>
                    <p class="adminx-kicker">ADMIN PANEL</p>
                    <h1>Contacts</h1>
                    <span>Customer messages</span>
                </div>
            </div>


<section class="adminx-panel">
    <div class="adminx-panel-head">
        <h2>Contact Messages</h2>
        <span th:text="${contacts != null ? contacts.size() + ' messages' : '0 messages'}">0 messages</span>
    </div>

    <div class="adminx-table-wrap">
        <table class="adminx-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Sender</th>
                <th>Subject</th>
                <th>Message</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="c : ${contacts}">
                <td th:text="${c.maLH}">1</td>

                <td>
                    <strong th:text="${c.hoTen}">Name</strong>
                    <small th:text="${c.email}">email@gmail.com</small>
                </td>

                <td th:text="${c.tieuDe}">Subject</td>
                <td><small th:text="${c.noiDung}">Message</small></td>

                <td>
                    <span class="adminx-badge" th:text="${c.trangThai}">Pending</span>
                </td>

                <td>
                    <div class="adminx-actions">
                        <a th:if="${c.trangThai != 'Resolved'}"
                           th:href="@{/admin/contacts/resolve/{id}(id=${c.maLH})}">
                            Resolve
                        </a>

                        <span th:if="${c.trangThai == 'Resolved'}">Done</span>
                    </div>
                </td>
            </tr>

            <tr th:if="${contacts == null or contacts.isEmpty()}">
                <td colspan="6">
                    <div class="adminx-empty">No contact messages found.</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

        </main>
    </div>
</body>
</html>
