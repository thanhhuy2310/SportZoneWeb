<div th:fragment="adminHeader(title, subtitle)" class="adminx-top">
    <div>
        <p class="adminx-kicker">ADMIN PANEL</p>
        <h1 th:text="${title}">Dashboard</h1>
        <span th:text="${subtitle}">SportZone Management</span>
    </div>

    <div style="display: flex; align-items: center; gap: 20px;">
        <a th:href="@{/notifications}" aria-label="Notifications" style="text-decoration: none; color: #9ca3af; display: flex; align-items: center; justify-content: center; transition: color 0.2s ease;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </a>

        <a th:href="@{/admin}" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;">
            <div class="adminx-avatar" style="width: 44px; height: 44px; background: #e8002d; color: #fff; display: grid; place-items: center; font-weight: 900; border-radius: 50%; font-size: 14px;">
                AD
            </div>
            <div>
                <strong style="display: block; font-size: 14px; color: #ffffff;" th:text="${session.user != null ? session.user.hoTen : 'Admin'}">Admin User</strong>
                <small style="display: block; color: #9ca3af; font-size: 12px;" th:text="${session.user != null ? session.user.vaiTro : 'SUPER ADMIN'}">ADMIN</small>
            </div>
        </a>
    </div>
</div>
