<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SportZone Admin</title>
    <link rel="stylesheet" th:href="@{/css/sportzone.css}">
</head>
<body class="adminx-body">
<div class="adminx-shell">
    <div th:replace="~{admin/fragments/admin-sidebar :: adminSidebar('dashboard')}"></div>

    <main class="adminx-main">
        <div th:replace="~{admin/fragments/admin-header :: adminHeader('Dashboard', 'SportZone Management Overview')}"></div>

        <section class="admin-pro-stats" style="margin-bottom: 24px;">
            <div class="admin-pro-card">
                <span>Total Revenue</span>
                <strong th:text="${'$' + #numbers.formatDecimal(revenue / 26000, 1, 'COMMA', 2, 'POINT')}">$0.00</strong>
                <p style="color: var(--green);">Paid / Delivered</p>
            </div>

            <div class="admin-pro-card">
                <span>Total Orders</span>
                <strong th:text="${totalOrders}">0</strong>
                <p style="color: var(--green);">All orders</p>
            </div>

            <div class="admin-pro-card">
                <span>Active Customers</span>
                <strong th:text="${totalUsers}">0</strong>
                <p style="color: var(--green);">Registered users</p>
            </div>

            <div class="admin-pro-card">
                <span>Total Products</span>
                <strong th:text="${totalProducts}">0</strong>
                <p style="color: #ff5875;">Inventory items</p>
            </div>
        </section>

        <section class="adminx-panel" style="margin-bottom: 24px;">
            <div class="adminx-panel-head">
                <h2>Revenue & Orders</h2>
            </div>

            <div class="adminx-table-wrap">
                <table class="adminx-table">
                    <thead>
                    <tr>
                        <th>Month</th>
                        <th>Revenue</th>
                        <th>Orders</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${revenueRows}">
                        <td th:text="${row.month}">Jan</td>
                        <td th:text="${'$' + #numbers.formatDecimal(row.revenue / 26000, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                        <td th:text="${row.orders}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="adminx-panel">
            <div class="adminx-panel-head">
                <h2>Recent Orders</h2>
                <a style="color: var(--red); font-weight: 800; text-decoration: none;" th:href="@{/admin/orders}">View All →</a>
            </div>

            <div class="adminx-table-wrap">
                <table class="adminx-table">
                    <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${recentOrders}">
                        <td th:text="${'SZ-' + order.maDH}">SZ-01</td>
                        <td th:text="${order.hoTenNhan}">Customer</td>
                        <td th:text="${'$' + #numbers.formatDecimal(order.tongTien / 26000, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                        <td><span class="adminx-badge" th:text="${order.trangThaiDonHang}">Pending</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
