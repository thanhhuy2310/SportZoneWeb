<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categories | SportZone Admin</title>
    <link rel="stylesheet" th:href="@{/css/sportzone.css}">
</head>

<body class="adminx-body">
    <div class="adminx-shell">
        <div th:replace="~{admin/fragments/admin-sidebar :: adminSidebar}"></div>

        <main class="adminx-main">
            <div class="adminx-top">
                <div>
                    <p class="adminx-kicker">ADMIN PANEL</p>
                    <h1>Categories</h1>
                    <span>Manage categories and filters</span>
                </div>
            </div>


<div class="adminx-alert" th:if="${param.deleteError}">
    Không thể xóa danh mục vì đang có sản phẩm sử dụng danh mục này.
</div>

<section class="adminx-panel">
    <div class="adminx-panel-head">
        <h2>Category List</h2>
        <a class="adminx-btn" th:href="@{/admin/categories/create}">+ Add Category</a>
    </div>

    <div class="adminx-table-wrap">
        <table class="adminx-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Icon</th>
                <th>Category</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="c : ${categories}">
                <td th:text="${c.maLoai}">1</td>
                <td><span class="adminx-icon" th:text="${c.icon}">run</span></td>
                <td><strong th:text="${c.tenLoai}">Running</strong></td>
                <td><small th:text="${c.moTa}">Description</small></td>
                <td><span class="adminx-badge" th:text="${c.trangThai ? 'Active' : 'Hidden'}">Active</span></td>
                <td>
                    <div class="adminx-actions">
                        <a th:href="@{/admin/categories/edit/{id}(id=${c.maLoai})}">Edit</a>
                        <a class="danger"
                           onclick="return confirm('Bạn có chắc muốn xóa danh mục này?')"
                           th:href="@{/admin/categories/delete/{id}(id=${c.maLoai})}">Delete</a>
                    </div>
                </td>
            </tr>

            <tr th:if="${categories == null or categories.isEmpty()}">
                <td colspan="6">
                    <div class="adminx-empty">No categories found.</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

        </main>
    </div>
</body>
</html>
