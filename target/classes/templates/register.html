<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SportZone</title>
    <link rel="stylesheet" th:href="@{/css/sportzone.css}">
</head>
<body>
    <main class="sz-auth-wrap">
        <section class="sz-auth-card">
            <a class="sz-logo sz-auth-logo" th:href="@{/}">
                <span class="sz-logo-box">SZ</span>
                <span class="sz-logo-text">SPORT<span>ZONE</span></span>
            </a>

            <h1 class="sz-auth-title">Create Account</h1>
            <p class="sz-auth-sub">
                Already have an account?
                <a th:href="@{/login}">Sign in</a>
            </p>

            <div th:if="${error}" class="sz-error" th:text="${error}">Email already exists.</div>

            <div class="sz-social-row">
                <button class="sz-social-btn" type="button">Google</button>
                <button class="sz-social-btn" type="button">Apple</button>
            </div>

            <div class="sz-divider">or register with email</div>

            <form th:action="@{/register}" th:object="${nguoiDung}" method="post">
                <div class="sz-form-grid">
                    <div class="sz-field">
                        <label>First Name</label>
                        <input class="sz-input" th:field="*{hoTen}" placeholder="John Smith" required>
                    </div>

                    <div class="sz-field">
                        <label>Phone</label>
                        <input class="sz-input" th:field="*{soDienThoai}" placeholder="+1 (555) 000-0000">
                    </div>
                </div>

                <div class="sz-field">
                    <label>Email Address</label>
                    <input class="sz-input" type="email" th:field="*{email}" placeholder="john@example.com" required>
                </div>

                <div class="sz-field">
                    <label>Password</label>
                    <input class="sz-input" type="password" th:field="*{matKhau}" placeholder="Min. 8 characters" required>
                </div>

                <div class="sz-field">
                    <label>Address</label>
                    <input class="sz-input" th:field="*{diaChi}" placeholder="123 Main Street">
                </div>

                <p class="sz-form-note">
                    <input type="checkbox" required>
                    I agree to the <span style="color: var(--red);">Terms of Service</span>
                    and <span style="color: var(--red);">Privacy Policy</span>.
                </p>

                <button class="sz-btn" type="submit" style="width: 100%; height: 76px; font-size: 18px;">
                    Create Account →
                </button>
            </form>
        </section>
    </main>
</body>
</html>
