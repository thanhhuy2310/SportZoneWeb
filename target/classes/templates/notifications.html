<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - SportZone</title>
    <link rel="stylesheet" th:href="@{/css/sportzone.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<section class="sz-section">
    <div class="sz-container">
        <div class="sz-section-head">
            <div>
                <div class="sz-kicker">ACCOUNT</div>
                <h1 class="sz-page-title">NOTIFICATIONS</h1>
            </div>
            <form method="post" th:action="@{/notifications/read-all}">
                <button class="sz-btn dark" type="submit">MARK ALL AS READ</button>
            </form>
        </div>
        <div class="sz-card" th:each="notification : ${notifications}" style="margin-bottom: 12px; padding: 18px;">
            <div style="display: flex; gap: 16px; justify-content: space-between; align-items: flex-start;">
                <div>
                    <strong th:text="${notification.title}">Notification</strong>
                    <p th:text="${notification.content}">Content</p>
                    <small th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}">Date</small>
                </div>
                <form method="post" th:if="${!notification.readStatus}"
                      th:action="@{/notifications/{id}/read(id=${notification.notificationId})}">
                    <button class="sz-btn dark" type="submit">READ</button>
                </form>
            </div>
        </div>
        <div class="sz-empty" th:if="${notifications == null or notifications.isEmpty()}">No notifications yet.</div>
    </div>
</section>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
