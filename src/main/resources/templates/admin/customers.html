<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers | SportZone Admin</title>
    <link rel="stylesheet" th:href="@{/css/sportzone.css}">
</head>

<body class="adminx-body">
    <div class="adminx-shell">
        <div th:replace="~{admin/fragments/admin-sidebar :: adminSidebar}"></div>

        <main class="adminx-main">
            <div class="adminx-top">
                <div>
                    <p class="adminx-kicker">ADMIN PANEL</p>
                    <h1>Customers</h1>
                    <span>Manage customer accounts</span>
                </div>
            </div>


<section class="adminx-panel">
    <div class="adminx-panel-head">
        <h2>Customer Accounts</h2>
        <span th:text="${customers != null ? customers.size() + ' users' : '0 users'}">0 users</span>
    </div>

    <div class="adminx-table-wrap">
        <table class="adminx-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="u : ${customers}">
                <td th:text="${u.maND}">1</td>

                <td>
                    <strong th:text="${u.hoTen}">Customer</strong>
                    <small th:text="${u.diaChi}">Address</small>
                </td>

                <td th:text="${u.email}">email@gmail.com</td>
                <td th:text="${u.soDienThoai}">0900000000</td>
                <td><span class="adminx-badge" th:text="${u.vaiTro}">USER</span></td>
                <td><span class="adminx-badge" th:text="${u.trangThai ? 'Active' : 'Locked'}">Active</span></td>
            </tr>

            <tr th:if="${customers == null or customers.isEmpty()}">
                <td colspan="6">
                    <div class="adminx-empty">No customers found.</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

        </main>
    </div>
</body>
</html>
