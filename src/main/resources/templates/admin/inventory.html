<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | SportZone Admin</title>
    <link rel="stylesheet" th:href="@{/css/sportzone.css}">
</head>
<body class="adminx-body">
<div class="adminx-shell">
    <div th:replace="~{admin/fragments/admin-sidebar :: adminSidebar('inventory')}"></div>

    <main class="adminx-main">
        <div th:replace="~{admin/fragments/admin-header :: adminHeader('Inventory', 'Import and adjust product variants')}"></div>

        <div class="adminx-alert" th:if="${param.error}">Please enter a valid quantity.</div>

        <section class="adminx-panel">
            <div class="adminx-panel-head">
                <h2>Product Variant Inventory</h2>
            </div>
            <div class="adminx-table-wrap">
                <table class="adminx-table">
                    <thead>
                    <tr>
                        <th>Variant</th>
                        <th>Product</th>
                        <th>SKU</th>
                        <th>Current stock</th>
                        <th>Import</th>
                        <th>Adjust stock</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="variant : ${variants}">
                        <td th:text="${variant.maBT}">1</td>
                        <td th:text="${variant.sanPham != null ? variant.sanPham.tenSP : '-'}">Product</td>
                        <td th:text="${variant.sku}">SKU</td>
                        <td th:text="${variant.soLuongTon}">0</td>
                        <td>
                            <form method="post" th:action="@{/admin/inventory/import}" style="display: flex; gap: 8px;">
                                <input type="hidden" name="variantId" th:value="${variant.maBT}">
                                <input type="number" name="quantity" min="1" required style="width: 80px;">
                                <input type="text" name="note" placeholder="Note">
                                <button class="adminx-btn" type="submit">Import</button>
                            </form>
                        </td>
                        <td>
                            <form method="post" th:action="@{/admin/inventory/adjust}" style="display: flex; gap: 8px;">
                                <input type="hidden" name="variantId" th:value="${variant.maBT}">
                                <input type="number" name="quantity" min="0" required style="width: 80px;" th:value="${variant.soLuongTon}">
                                <input type="text" name="note" placeholder="Note">
                                <button class="adminx-btn" type="submit">Adjust</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${variants == null or variants.isEmpty()}">
                        <td colspan="6"><div class="adminx-empty">No product variants found.</div></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
