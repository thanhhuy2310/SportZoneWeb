<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - SportZone</title>
    <link rel="stylesheet" th:href="@{/css/sportzone.css}">
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<section class="sz-section">
    <div class="sz-container">
        <h1 class="sz-page-title">EDIT PROFILE</h1>

        <form class="sz-checkout-box"
              th:action="@{/profile/update}"
              method="post">

            <div class="sz-field">
                <label>Full Name</label>
                <input class="sz-input"
                       type="text"
                       name="hoTen"
                       th:value="${loginUser.hoTen}"
                       required>
            </div>

            <div class="sz-field">
                <label>Email</label>
                <input class="sz-input"
                       type="email"
                       name="email"
                       th:value="${loginUser.email}"
                       required>
            </div>

            <div class="sz-field">
                <label>Phone</label>
                <input class="sz-input"
                       type="text"
                       name="soDienThoai"
                       th:value="${loginUser.soDienThoai}">
            </div>

            <div class="sz-field">
                <label>Address</label>
                <input class="sz-input"
                       type="text"
                       name="diaChi"
                       th:value="${loginUser.diaChi}">
            </div>

            <button class="sz-btn" type="submit">
                SAVE PROFILE →
            </button>

            <a class="sz-btn dark" th:href="@{/profile}">
                BACK
            </a>
        </form>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
